# FIregate DHCP and DNS Engine Configuration
# Subject to change once I add VLANS

interface=eth1

no-dhcp-interface=eth0

#  Subject to change once ad-blocking and unbound are implemented. Cloudflare Family DNS preferred for malware and nsfw blocking.
server=1.1.1.3
server=1.0.0.3

cache-size=1000

local=/firegate.internal/
domain=firegate.internal

dhcp-range=10.0.0.100,10.0.0.200,255.255.255.0,12h

dhcp-option=option:router,10.0.0.1
dhcp-option=option:dns-server,10.0.0.1
